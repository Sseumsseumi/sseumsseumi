services:
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - sseumsseumi-network
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - sseumsseumi-network
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped
    depends_on:
      - prometheus

  # Redis Exporter(Redis--번역(Redis Exporter)-->Prometheus)
  redis_exporter:
    image: oliver006/redis_exporter
    container_name: redis_exporter
    ports:
      - "9121:9121"
    environment:
    - REDIS_ADDR=redis:6379
    - REDIS_PASSWORD=${REDIS_PASSWORD}
    restart: unless-stopped
    networks:
      - sseumsseumi-network

volumes:
  grafana_data:

networks:
  sseumsseumi-network:
    external: true